services:
  catalog-postgres:
    image: postgres:17-alpine
    container_name: gigmarket-catalog-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: gigmarket_catalog
    ports:
      # 5432 está ocupado por un Postgres local (Homebrew) en este dev machine.
      - "5433:5432"
    volumes:
      - catalog-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d gigmarket_catalog"]
      interval: 5s
      timeout: 3s
      retries: 5

  orders-postgres:
    image: postgres:17-alpine
    container_name: gigmarket-orders-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: gigmarket_orders
    ports:
      - "5434:5432"
    volumes:
      - orders-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d gigmarket_orders"]
      interval: 5s
      timeout: 3s
      retries: 5

  catalog-api:
    build:
      context: .
      dockerfile: services/catalog-api/Catalog.Api/Dockerfile
    container_name: gigmarket-catalog-api
    depends_on:
      catalog-postgres:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__GigmarketCatalog: "Host=catalog-postgres;Port=5432;Database=gigmarket_catalog;Username=postgres;Password=postgres"
    ports:
      - "5065:8080"

  orders-api:
    build:
      context: .
      dockerfile: services/orders-api/Orders.Api/Dockerfile
    container_name: gigmarket-orders-api
    depends_on:
      orders-postgres:
        condition: service_healthy
      catalog-api:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__GigmarketOrders: "Host=orders-postgres;Port=5432;Database=gigmarket_orders;Username=postgres;Password=postgres"
      Services__Catalog__BaseUrl: "http://catalog-api:8080"
    ports:
      - "5066:8080"

volumes:
  catalog-postgres-data:
  orders-postgres-data: